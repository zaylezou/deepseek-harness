# dsh-e2e bundle patch
#
# 提供 `e2e` 工具：专用无头 Chromium + 步骤执行 + 截图。
# 这里只放默认值；真实部署的 baseUrl / sessionsFile 属于本机配置，
# 写在 <profile>/cordis.patch.yml 里覆盖整块 config。

- insert:
    - id: dsh-e2e
      name: 'dsh-e2e'
      config:
        # 默认打开的地址；留空 = 每次调用都要传 url
        baseUrl: ''
        # dsh = 自动复用 dsh-webui-auth 的会话 token；none = 不带登录态
        auth: 'none'
        # auth=dsh 时必填：dsh-webui-auth 的会话文件
        sessionsFile: ''
        cookieName: 'dsh_wua_session'
        # 专用浏览器的 CDP 地址（容器用 host 网络，所以是回环地址）
        cdpUrl: 'http://127.0.0.1:9334'
        # 临时实例监听地址；留空 = 用镜像过来的 profile 配置，实际地址以启动日志为准
        instanceHost: ''
        # 连不上时自动起一个专用容器
        autoStart: true
        dockerImage: 'mcr.microsoft.com/playwright:latest'
        containerName: 'dsh-e2e-browser'
        # 改用本机 chromium 时填这里，留空走容器
        executablePath: ''
        viewportWidth: 1440
        viewportHeight: 900
        locale: 'zh-CN'
        timeoutMs: 30000
        maxScreenshots: 6
        screenshotDir: ''
